networks:
  forte:
    driver: bridge

volumes:
  forte-data:

services:

  backend:
    build: ./backend
    container_name: forte-backend
    restart: unless-stopped
    networks:
      - forte
    environment:
      # Comma-separated "user:pass" pairs
      FORTE_USERS: ${FORTE_USERS:-admin:password123}
      # Session TTL in nftables format (e.g. 8h, 30m)
      FORTE_SESSION_TTL: ${FORTE_SESSION_TTL:-8h}
      # nftables table and set names (must match firewall.nft)
      FORTE_NFT_TABLE: ${FORTE_NFT_TABLE:-forte}
      FORTE_NFT_SET: ${FORTE_NFT_SET:-allowed_macs}
      # Set to OpenWRT container name to run nft via docker exec (test rig)
      FORTE_ROUTER_CONTAINER: ${FORTE_ROUTER_CONTAINER:-}
      # Comma-separated admin usernames allowed to manage users
      FORTE_ADMINS: ${FORTE_ADMINS:-admin}
      # Comma-separated CORS origins
      FORTE_CORS_ORIGINS: ${FORTE_CORS_ORIGINS:-http://localhost}
    volumes:
      - forte-data:/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  portal:
    build:
      context: ./portal
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_DEFAULT_REDIRECT: ${VITE_DEFAULT_REDIRECT:-http://captive.apple.com/hotspot-detect.html}
        VITE_APP_NAME: ${VITE_APP_NAME:-Forte WiFi}
        VITE_APP_TAGLINE: ${VITE_APP_TAGLINE:-Sign in to access the network}
        VITE_POLICY_TEXT: ${VITE_POLICY_TEXT:-By signing in you agree to the network usage policy.}
        VITE_TOKEN_KEY: ${VITE_TOKEN_KEY:-forte_token}
    container_name: forte-portal
    restart: unless-stopped
    networks:
      - forte
    ports:
      - "${PORTAL_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
