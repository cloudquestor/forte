networks:
  forte:
    driver: bridge

volumes:
  forte-data:

services:

  backend:
    image: ghcr.io/cloudquestor/forte-backend:latest
    # build: ./backend
    container_name: forte-backend
    restart: unless-stopped
    networks:
      - forte
    environment:
      # Comma-separated "user:pass" pairs
      FORTE_USERS: ${FORTE_USERS}
      # Enable debug logging
      FORTE_DEBUG: ${FORTE_DEBUG:-false}
      # Session TTL in nftables format (e.g. 8h, 30m)
      FORTE_SESSION_TTL: ${FORTE_SESSION_TTL:-8h}
      # nftables table and set names (must match firewall.nft)
      FORTE_NFT_TABLE: ${FORTE_NFT_TABLE:-forte}
      FORTE_NFT_SET: ${FORTE_NFT_SET:-allowed_macs}
      # Set to OpenWRT container name to run nft via docker exec (test rig)
      FORTE_ROUTER_CONTAINER: ${FORTE_ROUTER_CONTAINER:-}
      # Comma-separated admin usernames allowed to manage users
      FORTE_ADMINS: ${FORTE_ADMINS:-admin}
      # Comma-separated CORS origins
      FORTE_CORS_ORIGINS: ${FORTE_CORS_ORIGINS:-http://localhost}
      # Omada controller integration (optional)
      OMADA_CONTROLLER_URL: ${OMADA_CONTROLLER_URL:-}
      OMADA_CONTROLLER_ID: ${OMADA_CONTROLLER_ID:-}
      OMADA_SITE_ID: ${OMADA_SITE_ID:-Default}
      OMADA_USERNAME: ${OMADA_USERNAME:-}
      OMADA_PASSWORD: ${OMADA_PASSWORD:-}
      FORTE_MSG91_API_KEY: ${FORTE_MSG91_API_KEY:-}
      FORTE_MSG91_TEMPLATE_ID: ${FORTE_MSG91_TEMPLATE_ID:-}
      FORTE_OTP_DUMMY: ${FORTE_OTP_DUMMY:-true}
      FORTE_OTP_DUMMY_CODE: ${FORTE_OTP_DUMMY_CODE:-123456}
      FORTE_BUILDINGS: ${FORTE_BUILDINGS:-}
      FORTE_TOWER_NUMBERS: ${FORTE_TOWER_NUMBERS:-}
      FORTE_BLOCKS: ${FORTE_BLOCKS:-}
      FORTE_FLOORS: ${FORTE_FLOORS:-}
    volumes:
      - forte-data:/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  portal:
    image: ghcr.io/cloudquestor/forte-portal:latest
    # build: ./portal
    container_name: forte-portal
    restart: unless-stopped
    networks:
      - forte
    environment:
      VITE_API_URL: ${VITE_API_URL:-}
      VITE_DEFAULT_REDIRECT: ${VITE_DEFAULT_REDIRECT:-/status?status=success}
      VITE_APP_NAME: ${VITE_APP_NAME:-Forte WiFi}
      VITE_APP_TAGLINE: ${VITE_APP_TAGLINE:-Sign in to access the network}
      VITE_POLICY_TEXT: ${VITE_POLICY_TEXT:-By signing in you agree to the [[policy]].}
      VITE_POLICY_URL: ${VITE_POLICY_URL:-}
      VITE_TOKEN_KEY: ${VITE_TOKEN_KEY:-forte_token}
    ports:
      - "${PORTAL_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
