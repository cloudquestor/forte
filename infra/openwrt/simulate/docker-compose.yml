networks:
  lan:
    driver: bridge
    ipam:
      config:
        - subnet: 10.99.1.0/24
  captive:
    driver: bridge
    ipam:
      config:
        - subnet: 10.99.2.0/24

services:
  openwrt:
    image: openwrt/rootfs:x86_64
    container_name: forte-openwrt
    privileged: true
    networks:
      lan:
        ipv4_address: 10.99.1.2
      captive:
        ipv4_address: 10.99.2.2
    ports:
      - "2222:22"     # SSH / dropbear
      - "8080:80"     # LuCI web UI
    volumes:
      - ./init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: unless-stopped
