name: Publish Images

on:
  push:
    branches:
      - main
      - 'feature/*'
      - 'bug-fix/*'
  pull_request:
    branches:
      - main
    types:
      - closed


env:
  REGISTRY: ghcr.io
  OWNER: cloudquestor

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # ✅ Generate short SHA
      - name: Generate short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -----------------------
      # Backend Image
      # -----------------------
      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/forte-backend:sha-${{ env.SHORT_SHA }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/forte-backend:${{ github.ref_name == 'main' && 'main' || github.ref_name }}
            ${{ github.ref_name == 'main' && format('{0}/{1}/forte-backend:latest', env.REGISTRY, env.OWNER) || '' }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}/{1}/forte-backend:{2}', env.REGISTRY, env.OWNER, github.ref_name) || '' }}

          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -----------------------
      # Portal Image
      # -----------------------
      - name: Build & push portal
        uses: docker/build-push-action@v5
        with:
          context: ./portal
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/forte-portal:sha-${{ env.SHORT_SHA }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/forte-portal:${{ github.ref_name == 'main' && 'main' || github.ref_name }}
            ${{ github.ref_name == 'main' && format('{0}/{1}/forte-portal:latest', env.REGISTRY, env.OWNER) || '' }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}/{1}/forte-portal:{2}', env.REGISTRY, env.OWNER, github.ref_name) || '' }}
        
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
