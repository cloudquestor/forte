name: Publish Images

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  OWNER: cloudquestor

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/forte-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push portal
        uses: docker/build-push-action@v5
        with:
          context: ./portal
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/forte-portal:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max